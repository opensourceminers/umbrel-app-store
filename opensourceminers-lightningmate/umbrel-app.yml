manifestVersion: 1
id: opensourceminers-lightningmate
category: bitcoin
name: Lightning Mate
version: "0.7.1"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  LightningMate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click.


  Flip on the Autopilot and the node tunes its own fees and runs only profitable
  rebalances on recommended settings — with safe caps and per-channel cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right from the
  app: purchase inbound, list your own sell offer, and let the Autopilot fulfil
  orders automatically — opening channels to buyers within your capital caps.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  Deeper routing insight — and a fix for silently-failed Magma selling.
  - Fixed: an expired or revoked Amboss key made Magma buying AND selling
    silently do nothing — no offers listed, no orders fulfilled — while the app
    still showed "connected". LightningMate now checks whether Amboss still
    accepts your key and shows "key expired — reconnect" in Settings and the
    Sell tab. If you've never sold despite having selling on, this was likely
    why: reconnect with a fresh key.
  - New Routing view (Analytics → Routing): per-channel flow direction
    (draining / filling / balanced, flagged when a draining channel is nearly
    empty), routing corridors (the channel pairs that actually carry your flow —
    a route needs both a source and a sink), and a banner for the forwards you
    refused for lack of liquidity. Turns the forwards log into "where does flow
    go, where am I losing it, what to do".
  - Carried over from 0.7.0 for anyone updating from before: LSP mode (beta,
    sell channels directly over LSPS1/bLIP-51, off by default), the "Advertise
    routable size" autopilot option, and the unserved-demand telemetry.

