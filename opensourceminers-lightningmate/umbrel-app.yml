manifestVersion: 1
id: opensourceminers-lightningmate
category: bitcoin
name: Lightning Mate
version: "0.8.4"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  LightningMate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click.


  Flip on the Autopilot and the node tunes its own fees and runs only profitable
  rebalances on recommended settings — with safe caps and per-channel cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right from the
  app: purchase inbound, list your own sell offer, and let the Autopilot fulfil
  orders automatically — opening channels to buyers within your capital caps.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  Fixes from testing 0.8.3, and faster fees where a drained channel sells.

  Magma selling
  - Switching Liquidity provision on lists your offers again. Switching it off
    disables your listed offers, and 0.8.3 then left each one off until you
    enabled it by hand. Now the offers that were disabled when you switch
    selling on are listed again once each can be funded and has its price —
    also offers whose terms you set yourself (they keep them). The
    confirmation tells you how many; "keep disabled" on Market → Sell keeps
    one off.
  - An offer is only listed again once its terms are on Amboss and checked.
    If the autopilot prices it, that is its current price: until it has one,
    the offer waits, so it never goes live at an old price. Offers whose terms
    you set are listed at your price.
  - Your offer's base fee follows the market. 0.8.0 had reset it to 0 sat;
    nearly every Magma offer charges one (median 568 sat). With auto-pricing
    on, the autopilot moves your base to what comparable offers charge once
    that has differed for a day, and lowers the rate to match, so a channel of
    your typical size costs the same. It never lowers the base so far that
    your smallest channel no longer covers its on-chain costs.

  Fees and rebalancing
  - A drained channel that keeps selling is raised faster: by a quarter of its
    fee every 6 hours instead of 20 ppm every three days — each step only
    after three sales at the current fee, so it never runs far ahead of what
    buyers pay.
  - The rebalancer refills such a channel once a higher price is proven by
    real sales, sized to what sold at it, and no longer judges a drained
    channel by the two weeks in which it couldn't sell.
