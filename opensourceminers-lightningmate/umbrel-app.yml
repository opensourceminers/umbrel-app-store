manifestVersion: 1
id: opensourceminers-lightningmate
category: bitcoin
name: Lightning Mate
version: "0.7.7"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  LightningMate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click.


  Flip on the Autopilot and the node tunes its own fees and runs only profitable
  rebalances on recommended settings — with safe caps and per-channel cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right from the
  app: purchase inbound, list your own sell offer, and let the Autopilot fulfil
  orders automatically — opening channels to buyers within your capital caps.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  Fixes for the offer auto-sizing introduced in 0.7.6.
  - Auto-sizing no longer touches your price. With auto-pricing switched off,
    resizing or relisting an offer used to write the engine's recommended price
    over the one you had set, and with no offer listed it could even create one
    at the engine's price. Sizing now only ever changes the size range and lease
    length; the price is yours unless you delegate it.
  - Upgrading to 0.7.6 switched auto-sizing on for everyone, even where
    auto-pricing was deliberately off. That migration is fixed: auto-sizing now
    follows your auto-pricing setting on upgrade, and installs that already ran
    0.7.6 with pricing off get sizing switched back off. The repair only ever
    turns automation off, never on.
  - With auto-pricing off, the smallest order auto-sizing admits is now worked
    out from your own listed price rather than the engine's, so it cannot open
    the window to orders that would lose money at the price you set.

  Thanks to the Umbrel team for spotting the first two in review.
