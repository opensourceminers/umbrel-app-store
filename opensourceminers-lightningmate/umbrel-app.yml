manifestVersion: 1
id: opensourceminers-lightningmate
category: bitcoin
name: Lightning Mate
version: "0.7.6"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  LightningMate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click.


  Flip on the Autopilot and the node tunes its own fees and runs only profitable
  rebalances on recommended settings — with safe caps and per-channel cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right from the
  app: purchase inbound, list your own sell offer, and let the Autopilot fulfil
  orders automatically — opening channels to buyers within your capital caps.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  The Autopilot can now size your Magma offer, not just price it.
  - New switch: let the Autopilot keep your offer's size range and lease length
    in step with the market, up to a maximum order size you set. Size decides
    whether a buyer can be matched with you at all; price only decides what you
    earn once they are. An offer whose size range misses the orders people
    actually place cannot fill at any price.
  - The caps section now tells you what your cap is worth: the share of real
    Magma orders you can serve today, and what each larger maximum would unlock.
    The numbers come from Amboss's completed orders, not from guesswork.
  - If your on-chain balance, rather than your setting, is what limits you, the
    app says so plainly instead of letting you tune the wrong knob.
  - A maximum channel size above your capital cap is flagged, because an order
    that big could never be served.

  Carried over from 0.7.5: Magma offers are priced against Amboss's real
  completed orders instead of what other sellers are asking, the Autopilot no
  longer cuts the price a little further for every day without a sale (which
  wins nothing, since Amboss picks the seller and a purchase carries no offer
  id), and a bug that let the real price collapse to the base fee is fixed.
