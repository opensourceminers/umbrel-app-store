manifestVersion: 1
id: opensourceminers-lightningmate
category: bitcoin
name: Lightning Mate
version: "0.8.1"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  LightningMate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click.


  Flip on the Autopilot and the node tunes its own fees and runs only profitable
  rebalances on recommended settings — with safe caps and per-channel cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right from the
  app: purchase inbound, list your own sell offer, and let the Autopilot fulfil
  orders automatically — opening channels to buyers within your capital caps.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  A safety release for Magma selling — please update.

  - 0.8.0 could list your sell offer at 0 ppm + 0 sat. When it changed one
    term of an offer (the routing-fee promise, say), Amboss reset the terms
    it didn't send — the price included — and the check afterwards looked only
    at what was sent. LightningMate now sends every term with each change and
    checks all of them afterwards.
  - An offer Amboss lists for free gets a price back within minutes (the
    engine's with auto-pricing on, otherwise the last one it had). If no price
    is known, LightningMate takes the offer off the market and tells you. An
    offer without a price can't be enabled.
  - Orders that don't cover opening and closing their channel are turned down
    at once; an order Amboss priced at 0 sats is rejected a minute after it
    arrives, not left to time out.
  - Buyer conditions and on-chain fee settings set on amboss.tech are kept.
  - Overview: the autopilot, top channels and suggested peers side by side;
    repeated forwards grouped in the activity feed. Market → Sell is leaner:
    your offer first, the details one click away.

  If your offer shows 0 ppm on Market → Sell after the update, set its price
  (or use "Apply recommended to my offer") and enable it.
