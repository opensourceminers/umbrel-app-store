manifestVersion: 1
id: opensourceminers-lightningmate
category: bitcoin
name: Lightning Mate
version: "0.8.9"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  LightningMate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click.


  Flip on the Autopilot and the node tunes its own fees and runs only profitable
  rebalances on recommended settings — with safe caps and per-channel cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right from the
  app: purchase inbound, list your own sell offer, and let the Autopilot fulfil
  orders automatically — opening channels to buyers within your capital caps.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  Click any node for its details, and a simpler Channels page.

    Node details
    - Click a node's name in the Channels table, the suggestions, the close list,
      Analytics, Market or the autopilot's history. One sentence says where you
      stand with it, then come its channel, what it earned, what each side
      charges and its place in the network. The rest is under Advanced.
    - A node without a channel is scored the way the suggestions score it. What
      keeps it off the list comes first.
    - Find any node under Channels → To open by alias, key or key@host:port, and
      open a channel to it.
    - Opening a node asks mempool.space (where it runs, since when) and LN+ about
      that one node, through Tor. Each has its switch in Settings → Privacy.

    Channels
    - Four columns: node, size and balance, earned in 30 days, a note. Flow, fees
      and close are under "More columns", and your choice stays.
    - Fee modes and closing are also in a node's details.

    Fixed
    - The BTC price and your fiat figures through Tor: mempool.space didn't answer
      Tor exits, so its onion service is asked now.
    - Copy buttons on plain http://umbrel.local. They say "copied" only when it
      was.
    - A second open to a node by hand, while the first is still being sent, is
      refused instead of funding two channels.

    Nothing changes in how fees, refills, automatic opens or sales are decided.
