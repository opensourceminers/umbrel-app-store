manifestVersion: 1
id: opensourceminers-lightningmate
category: bitcoin
name: Lightning Mate
version: "0.8.6"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  LightningMate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click.


  Flip on the Autopilot and the node tunes its own fees and runs only profitable
  rebalances on recommended settings — with safe caps and per-channel cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right from the
  app: purchase inbound, list your own sell offer, and let the Autopilot fulfil
  orders automatically — opening channels to buyers within your capital caps.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  A full review of every autopilot, and the fixes for what it found.

  Fees
  - A fee is raised only after something sold at the current fee, and a
    raise nothing sells at is stepped back after two days — no more fee
    updates without a sale behind them.
  - A drained channel that keeps selling is raised by a quarter of its fee
    every 6 hours, each step after three sales at the fee before it.
  - max_htlc no longer resends an update that doesn't take.

  Rebalancing
  - Refills are valued at the highest fee that recently sold three times —
    a fee raise no longer erases that proof — and sized to what sold at it.
  - Every refill attempt ends inside its wait and is booked with LND's
    reason; an LND hiccup no longer blocks the rest of the run.

  Channels
  - With selling on, opens hold back only what your Magma offer can list;
    the rest can open routing channels again.
  - The close list now includes dead channels that only trickle a few sats.
    A sold channel is closed after its lease only when that is worth it, at
    an economy fee rate.
  - A peer's refusal moves on to the next peer; an open cut off by a restart
    is never repeated at once.

  Magma
  - No offer invites orders that would be turned down below cost: with
    auto-size the minimum channel rises with on-chain fees, and an offer no
    order could pay for is taken off the market until it can.
  - The base fee follows comparable offers — at once when far off, else
    after 1.5 h, at most every 6 h — and Market → Sell shows a pending change.
  - A pending order no longer lets an offer be topped up, fee parts are
    billed only at your offer's price, and an Accept below cost asks twice.

  Reliability
  - A call to LND or Amboss that never answers is given up at a deadline
    instead of stopping every autopilot until a restart; scheduled runs are
    no longer skipped while fees are written.
