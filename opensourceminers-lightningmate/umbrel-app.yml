manifestVersion: 1
id: opensourceminers-lightningmate
category: bitcoin
name: Lightning Mate
version: "0.7.4"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  LightningMate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click.


  Flip on the Autopilot and the node tunes its own fees and runs only profitable
  rebalances on recommended settings — with safe caps and per-channel cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right from the
  app: purchase inbound, list your own sell offer, and let the Autopilot fulfil
  orders automatically — opening channels to buyers within your capital caps.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  Channel peer suggestions now know who other node runners actually trust.
  - New: peers are checked against lightningnetwork.plus. Its rank, Prime status
    and the ratings real operators gave each other now feed into the suggestion
    score, next to the network-graph signals the app already used. A graph can
    show you that a node is well connected; it cannot tell you whether people
    who opened channels to it would do it again.
  - A peer with no LN+ profile is never penalised — most of the network isn't on
    LN+, and the score stays exactly as before for those. The reputation can only
    move a suggestion by up to 20% either way, so it refines the ranking instead
    of taking it over. Peers other operators rate badly get flagged.
  - The Autopilot uses the same signal when it opens channels on your behalf.
  - New LN+ tab under Market: browse Liquidity Pool nodes, and see open Swaps
    with an upfront check of whether YOUR node qualifies — capacity, channel
    count, Prime requirement and Tor vs clearnet — before you click through.
    Joining stays a manual decision, since it commits you to opening a channel
    within 48 hours and keeping it open for the full term.
  - Thanks to @RelativelyIrrelevant for suggesting the integration.

