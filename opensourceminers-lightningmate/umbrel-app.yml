manifestVersion: 1
id: opensourceminers-lightningmate
category: bitcoin
name: Lightning Mate
version: "0.7.0"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  LightningMate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click.


  Flip on the Autopilot and the node tunes its own fees and runs only profitable
  rebalances on recommended settings — with safe caps and per-channel cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right from the
  app: purchase inbound, list your own sell offer, and let the Autopilot fulfil
  orders automatically — opening channels to buyers within your capital caps.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  Become a Lightning Service Provider — and lose fewer forwards.
  - LSP mode (beta): sell inbound channels DIRECTLY to wallets speaking the open
    LSPS1 standard (bLIP-51) — a second demand source beside Magma, with no
    marketplace fee. Orders are priced by the same profit-aware engine, paid via
    a hold invoice that only settles once your channel is opening; every failure
    path refunds the buyer automatically. Capital is protected by the same
    reserve and deployment caps as Magma selling. Off by default — flip it on in
    Settings, share your node URI with the built-in buyer guide, and your node
    announces LSP support in the graph (feature bit 729) while it's on.
  - Advertise routable size (new autopilot option): keeps each channel's max
    HTLC just under its spendable balance so senders skip depleted channels —
    fewer failed forwards through your node, better reputation with senders.
  - Unserved demand (Rebalancing tab): see the forwards your node had to REFUSE
    for lack of outbound liquidity — count and volume per channel — exactly
    where a rebalance or a bigger channel pays for itself. Starts collecting
    after this update.
  - Security hardening around the new LSP surface: shared capital deployment
    cap across Magma + LSP sales, crash-proof peer-message handling.

