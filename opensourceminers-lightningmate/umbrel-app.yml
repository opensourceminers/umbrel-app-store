manifestVersion: 1
id: opensourceminers-lightningmate
category: bitcoin
name: Lightning Mate
version: "0.8.7"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  LightningMate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click.


  Flip on the Autopilot and the node tunes its own fees and runs only profitable
  rebalances on recommended settings — with safe caps and per-channel cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right from the
  app: purchase inbound, list your own sell offer, and let the Autopilot fulfil
  orders automatically — opening channels to buyers within your capital caps.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  Selling on Magma, fixed for buyers your node isn't already connected to.

  Orders
  - A buyer's node that takes a moment to answer is no longer turned down.
    Since 0.8.0 nearly every order from a node you weren't already connected
    to was rejected within seconds as "unreachable": the app gave LND's
    connection 1.5 s, and over Tor it takes far longer.
  - A dial now waits up to 90 s, onion addresses first. A buyer that can't be
    reached is dialed again every 3 minutes, and the order is rejected only
    about 4 minutes before its deadline. The order says what LND answered.
  - Silent buyers no longer hold up other orders.
  - A node's very first sale no longer fails its accept.
  - Past a paid order's deadline the payment goes back to the buyer rather
    than a channel being opened.

  Your offer
  - With auto-size and auto-relist your offer lists what "Max capital
    deployed" and the wallet allow, not just its largest order, and takes
    orders up to your max channel size. If your cap is above what you list
    today, the offer grows to it with this update. To list less, lower the
    cap on Autopilot → Magma.
  - While an order is pending, the offer's window and listing stay as they
    are.
  - Fewer needless offer updates: a base fee that just moved follows only a
    level that has held for 12 hours, and a minimum the mempool raised stays
    up for 6 hours.
  - Amboss still decides which seller a buyer is matched with; none of this
    makes a node sell.

  Sold channels
  - After its lease a sold channel is closed unless it earns about what
    selling those coins again would (at least 0.5 % a year on the coins a
    close frees) or under a quarter of it is on your side. A close never pays
    above your maximum on-chain fee rate.

  Alerts
  - A peer offline for a week or more is named, with what is stuck in its
    channel.

  Tested: a whole sale on real LND nodes on regtest (accept, held payment,
  channel, settlement, close, refund). Amboss's side was simulated, so the
  first live order is the first real run of this path: watch it on Market →
  Orders.
