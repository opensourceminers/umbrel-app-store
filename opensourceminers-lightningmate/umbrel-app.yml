manifestVersion: 1
id: opensourceminers-lightningmate
category: bitcoin
name: Lightning Mate
version: "0.7.5"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  LightningMate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click.


  Flip on the Autopilot and the node tunes its own fees and runs only profitable
  rebalances on recommended settings — with safe caps and per-channel cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right from the
  app: purchase inbound, list your own sell offer, and let the Autopilot fulfil
  orders automatically — opening channels to buyers within your capital caps.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  Magma selling, rebuilt around what buyers actually pay.
  - Your offer is now priced against Amboss's real completed orders, not against
    what other sellers are asking. Listed prices are wishes; this is what money
    changed hands at. The cheapest rung can no longer go below the 25th
    percentile of real sales.
  - Removed a feedback loop that quietly destroyed offers: the Autopilot used to
    cut the price a little more for every day without a sale. That does not help,
    because Magma's buy request carries no offer id at all — Amboss picks the
    seller, so being cheapest wins nothing and only gives away the margin. Offers
    that had already been driven to the floor are lifted back.
  - Fixed a pricing bug where the fee rate hit its 1 ppm minimum and the real
    price silently became whatever the base fee happened to be, often a fraction
    of the intended one.
  - New: "your size window reaches X% of real orders". This is usually the actual
    reason an offer sits unsold — a window that misses the median order size
    cannot be matched at any price. The app now shows what a larger maximum
    channel size would unlock, and the Autopilot keeps an existing offer's size
    range and lease length in step with the market instead of only its price.
  - The default lease length is now one buyers actually ask for.
  - Available liquidity on the market page subtracts each offer's committed
    orders, so a busy seller no longer looks wide open.
  - Buy: pick a specific seller from the ranked list and the order goes to them.
  - The market analysis no longer needs a connected Amboss key, so an expired key
    shows you why nothing is selling instead of an empty page.

