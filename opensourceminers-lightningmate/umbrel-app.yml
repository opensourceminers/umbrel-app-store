manifestVersion: 1
id: opensourceminers-lightningmate
category: bitcoin
name: Lightning Mate
version: "0.8.5"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  LightningMate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click.


  Flip on the Autopilot and the node tunes its own fees and runs only profitable
  rebalances on recommended settings — with safe caps and per-channel cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right from the
  app: purchase inbound, list your own sell offer, and let the Autopilot fulfil
  orders automatically — opening channels to buyers within your capital caps.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  Tor-only, a fast start page and a shorter Settings page.

  Tor-only
  - Every lookup Lightning Mate makes now goes through Umbrel's Tor proxy:
    LN+, the BTC price, Amboss's market data and now also the Amboss calls
    made with your API key (your offers and orders) and the service-fee
    lookup. Nothing leaves from your home IP address, and nothing needs a port
    opened on your router. The Tor route setting is gone: there is nothing to
    choose.
  - This keeps Magma selling running where a provider blocks Amboss's
    addresses (Spanish providers do during LaLiga matches): through Tor,
    Amboss stays reachable.
  - LSP mode no longer announces a clearnet address. Buyers get your node's
    .onion address in the buyer guide; an address an older version announced
    is withdrawn once when 0.8.5 starts.

  Faster start page
  - On a node with many failed payments (rebalance attempts, probes) the
    Overview could take over a minute to show its figures: LND walked its
    whole payment history, four times at once. It now reads only what it
    needs, once, and the page loads in under a second (the first load after
    a restart takes a few seconds while the network graph is read).

  Settings
  - Shorter: each section shows its switches and its state. The details
    (where each lookup goes, signing a message, how LSP mode reaches buyers)
    are one click away.
