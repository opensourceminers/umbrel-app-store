manifestVersion: 1
id: opensourceminers-lightningmate
category: bitcoin
name: Lightning Mate
version: "0.8.8"
tagline: Profit-aware management & autopilot for your Lightning node
description: >-
  LightningMate manages your Lightning node so you don't have to babysit it.
  It connects automatically to your Umbrel Lightning (LND) node.


  See channels with live balance bars and source / sink / router roles, a full
  Forwards routing report, and a Profit & Loss overview (routing revenue vs
  channel-open and rebalancing costs). Get scored channel-peer suggestions from
  the network graph and open channels in a click.


  Flip on the Autopilot and the node tunes its own fees and runs only profitable
  rebalances on recommended settings — with safe caps and per-channel cooldowns.


  Buy and sell channel liquidity on the Amboss Magma marketplace right from the
  app: purchase inbound, list your own sell offer, and let the Autopilot fulfil
  orders automatically — opening channels to buyers within your capital caps.


  Lightning Mate signs in with the per-app password Umbrel generates for it
  (shown when you open the app), so no other app on your server can read your
  node or move your funds.
releaseNotes: |-
  A simpler autopilot, and much less to read.

  Autopilot
  - One page instead of five tabs: your strategy, one row per area with its
    switch and what it did last, and your limits. Tables and advanced
    settings open under a row.
  - Capital to sell: choose "Everything free" and your offer follows what is
    free on chain after what you keep, at every run, or set "At most" an
    amount. Your current limit stays as it is until you choose.
  - One choice for your offer: "The autopilot manages my offer" covers price,
    size and listing, and closing a sold channel after its lease. The single
    switches, pricing modes and the largest order are under Advanced on the
    Selling row. Amboss still decides who gets orders.
  - The Selling status says how much is listed.

  Less to read
  - Long explanations moved behind a "?" across the app. Nothing is gone: a
    tap shows them.
  - Inbound offers and LN+ nodes show the top 10, with a button for the rest.
  - Fee rows choose auto, fixed or excluded from one menu, and the fee, open
    and close lists show a reason's first clause, the rest in a row's details.

  Nothing changes in how fees, refills, opens or sales are decided.
